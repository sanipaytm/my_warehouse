<!DOCTYPE html>
<html>
<head>
    <title>Warehouse System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h3>📦 Warehouse System</h3>

    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    <a href="/export" class="btn btn-success btn-sm">Excel</a>

    <div class="alert alert-info mt-2">
        Total Stock: {{ total if total else 0 }}
    </div>

    <!-- FORM -->
    <form method="POST" action="/submit" class="card p-3">

        <input type="text" id="vehicle" name="vehicle" class="form-control mb-2" placeholder="Scan Vehicle Barcode" required>

        <button type="button" onclick="startScanner()" class="btn btn-secondary mb-2">
            📷 Scan Barcode
        </button>

        <input type="text" name="model" class="form-control mb-2" placeholder="Model Name" required>

        <input type="number" name="qty" class="form-control mb-2" placeholder="Quantity" required>

        <button class="btn btn-primary">Submit</button>

    </form>

    <!-- TABLE -->
    <table class="table table-bordered mt-3">
        <tr>
            <th>ID</th>
            <th>Vehicle</th>
            <th>Model</th>
            <th>Qty</th>
            <th>Action</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>

            <td>
                <a href="/edit/{{ row[0] }}" class="btn btn-warning btn-sm">Edit</a>
                <a href="/delete/{{ row[0] }}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>

</div>

<!-- Scanner Area -->
<div id="reader" style="width:100%; max-width:300px; margin:auto;"></div>

<!-- Barcode Scanner Script -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
function startScanner() {

    const reader = document.getElementById("reader");
    reader.innerHTML = ""; // clear previous

    let scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },

        function(decodedText) {
            document.getElementById("vehicle").value = decodedText;

            scanner.stop().then(() => {
                reader.innerHTML = "";
            });
        },

        function(error) {
            // ignore scan errors
        }

    ).catch(err => {
        alert("Camera start nahi hua: " + err);
    });
}
</script>

</body>
</html>
