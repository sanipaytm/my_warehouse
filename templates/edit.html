<!DOCTYPE html>
<html>
<head>
    <title>Edit Item - Warehouse System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">✏️ Edit Item</h4>
        </div>
        
        <div class="card-body">
            <form method="POST" action="/update/{{ data[0] }}">
                
                <div class="mb-3">
                    <label class="form-label">Vehicle Number / Barcode</label>
                    <input type="text" name="vehicle" class="form-control" value="{{ data[1] }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Model Name</label>
                    <input type="text" name="model" class="form-control" value="{{ data[2] }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="qty" class="form-control" value="{{ data[3] }}" required>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">💾 Update</button>
                    <a href="/" class="btn btn-secondary">❌ Cancel</a>
                </div>
                
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
